<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Copilot</title>
    <style>
      body { width: 300px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #1d1d1f; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row { margin-bottom: 12px; }
      label { display: block; margin-bottom: 4px; color: #6e6e73; }
      select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d2d2d7; border-radius: 8px; font: inherit; }
      button { width: 100%; padding: 8px; border: none; border-radius: 999px; background: #7b3fe4; color: white; font: 600 13px system-ui, sans-serif; cursor: pointer; margin-top: 6px; }
      button.secondary { background: #e5e5ea; color: #1d1d1f; }
      button:disabled { opacity: 0.4; cursor: default; }
      .status { font-size: 12px; color: #3a3a3c; line-height: 1.45; }
      .ok { color: #1f8a3b; font-weight: 600; }
      .warn { color: #a05a00; font-weight: 600; }
      .hint { font-size: 11px; color: #6e6e73; margin-top: 10px; line-height: 1.4; }
      a { color: #7b3fe4; }
    </style>
  </head>
  <body>
    <h1>Job Copilot</h1>
    <div class="row status" id="status">Checking...</div>
    <div class="row">
      <label for="origin">App</label>
      <select id="origin"></select>
      <button id="open" class="secondary">Open Job Copilot</button>
    </div>
    <div class="row" id="site">
      <label>This site</label>
      <div class="status" id="siteStatus"></div>
      <button id="enable">Use on this site</button>
      <button id="disable" class="secondary">Stop using on this site</button>
    </div>
    <div class="hint">
      Works on Greenhouse, Lever, Ashby and Workday by default. Never runs on LinkedIn, Indeed or Jobright. Never submits a form,
      creates an account or enters a password. <a href="privacy.html" target="_blank">Privacy</a>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
