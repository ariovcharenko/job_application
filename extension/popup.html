<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Application Copilot</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px system-ui, sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        margin-bottom: 10px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #52525b;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        font: inherit;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #4f46e5;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #52525b;
      }
      .ok {
        color: #16a34a;
      }
      .warn {
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <h1>Job Application Copilot</h1>
    <div class="row">
      <label for="origin">App URL</label>
      <input id="origin" placeholder="http://localhost:3000" />
    </div>
    <button id="save">Save & open app</button>
    <div id="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
