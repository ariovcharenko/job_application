<head><title>Backend Engineer @ Brightloop</title></head>
<body>
  <div id="root"><form>
    <div class="ashby-application-form-field-entry"><label for="_systemfield_name" class="_label">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" /></div>
    <div class="ashby-application-form-field-entry"><label for="_systemfield_email" class="_label">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" /></div>
    <div class="ashby-application-form-field-entry"><label for="_systemfield_resume" class="_label">Resume</label><input id="_systemfield_resume" name="_systemfield_resume" type="file" /></div>
    <div class="ashby-application-form-field-entry"><label for="f-phone" class="_label">Phone number</label><input id="f-phone" type="tel" /></div>
    <div class="ashby-application-form-field-entry"><label for="f-linkedin" class="_label">LinkedIn</label><input id="f-linkedin" type="text" /></div>
    <div class="ashby-application-form-field-entry"><label for="f-github" class="_label">GitHub profile</label><input id="f-github" type="text" /></div>
    <div class="ashby-application-form-field-entry"><label for="f-why" class="_label">What interests you about Brightloop?</label><textarea id="f-why"></textarea></div>
    <div class="ashby-application-form-field-entry">
      <label id="f-auth-label" class="_label">Are you authorized to work in the United States?</label>
      <div role="group" aria-labelledby="f-auth-label"><button type="button" class="_option">Yes</button><button type="button" class="_option">No</button></div>
    </div>
    <button type="button" class="ashby-application-form-submit-button">Submit Application</button>
  </form></div>
</body>
