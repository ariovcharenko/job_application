<head>
  <title>Job Application for Backend Engineer at Brightloop</title>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Backend Engineer","hiringOrganization":{"@type":"Organization","name":"Brightloop"}}</script>
</head>
<body>
  <h1 class="app-title">Backend Engineer</h1>
  <span class="company-name">at Brightloop</span>
  <form id="application_form">
    <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input id="first_name" name="job_application[first_name]" type="text" /></div>
    <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input id="last_name" name="job_application[last_name]" type="text" /></div>
    <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input id="email" name="job_application[email]" type="text" /></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="tel" /></div>
    <div class="field"><label for="candidate-location">Location (City)</label><input id="candidate-location" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" type="text" /></div>
    <div class="field"><label for="resume">Resume/CV</label><input id="resume" type="file" name="resume" /></div>
    <div class="field"><label for="q_linkedin">LinkedIn Profile</label><input id="q_linkedin" type="text" /></div>
    <div class="field"><label for="q_site">Website</label><input id="q_site" type="text" /></div>
    <div class="field"><label for="q_current">Current company</label><input id="q_current" type="text" /></div>
    <div class="field">
      <label for="q_auth">Are you legally authorized to work in the United States? *</label>
      <select id="q_auth"><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select>
    </div>
    <div class="field">
      <label for="q_spons">Will you now or in the future require sponsorship for employment visa status? *</label>
      <select id="q_spons"><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select>
    </div>
    <div class="field">
      <label for="q_clear">Do you currently hold an active security clearance?</label>
      <select id="q_clear"><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select>
    </div>
    <div class="field"><label for="q_hear">How did you hear about this job?</label><select id="q_hear"><option value="">Please select</option><option>Job board</option><option>Referral</option></select></div>
    <div class="field"><label for="q_why">Why do you want to work at Brightloop? *</label><textarea id="q_why"></textarea></div>
    <div class="field"><label><input type="checkbox" id="q_consent" /> I agree to the privacy policy</label></div>
    <fieldset>
      <legend>Voluntary self-identification</legend>
      <label for="eeo_gender">Gender</label>
      <select id="eeo_gender"><option value="">Please select</option><option>Male</option><option>Female</option><option>Decline To Self Identify</option></select>
      <label for="eeo_race">Race</label>
      <select id="eeo_race"><option value="">Please select</option><option>Asian</option><option>White</option><option>Decline To Self Identify</option></select>
      <label for="eeo_vet">Veteran Status</label>
      <select id="eeo_vet"><option value="">Please select</option><option>I am not a protected veteran</option><option>I identify as one or more of the classifications of protected veteran</option><option>I don't wish to answer</option></select>
      <label for="eeo_dis">Disability Status</label>
      <select id="eeo_dis"><option value="">Please select</option><option>Yes, I have a disability, or have had one in the past</option><option>No, I do not have a disability and have not had one in the past</option><option>I do not want to answer</option></select>
    </fieldset>
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
