<head><title>Backend Engineer</title></head>
<body>
  <div data-automation-id="applyFlowMyExperiencePage">
    <h3>My Experience</h3>
    <div data-automation-id="workExperience-1">
      <h4>Work Experience 1</h4>
      <label for="we1-title">Job Title*</label><input id="we1-title" type="text" />
      <label for="we1-company">Company*</label><input id="we1-company" type="text" />
      <label for="we1-loc">Location</label><input id="we1-loc" type="text" />
      <label for="we1-from">From*</label><input id="we1-from" type="text" placeholder="MM/YYYY" />
      <label for="we1-desc">Role Description</label><textarea id="we1-desc"></textarea>
    </div>
    <div data-automation-id="workExperience-2">
      <h4>Work Experience 2</h4>
      <label for="we2-title">Job Title*</label><input id="we2-title" type="text" />
      <label for="we2-company">Company*</label><input id="we2-company" type="text" />
    </div>
    <div data-automation-id="education-1">
      <h4>Education 1</h4>
      <label for="ed1-school">School or University*</label><input id="ed1-school" type="text" />
      <label for="ed1-field">Field of Study</label><input id="ed1-field" type="text" />
      <label for="ed1-gpa">Overall Result (GPA)</label><input id="ed1-gpa" type="text" />
    </div>
    <label for="wd-linkedin">LinkedIn</label><input id="wd-linkedin" type="text" />
    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </div>
</body>
