<head><title>Backend Engineer</title></head>
<body>
  <h2 data-automation-id="jobPostingHeader">Backend Engineer</h2>
  <div data-automation-id="applyFlowMyInfoPage">
    <h3>My Information</h3>
    <label for="wd-first">First Name*</label><input id="wd-first" data-automation-id="legalNameSection_firstName" type="text" />
    <label for="wd-last">Last Name*</label><input id="wd-last" data-automation-id="legalNameSection_lastName" type="text" />
    <label for="wd-email">Email*</label><input id="wd-email" data-automation-id="email" type="text" />
    <label for="wd-device">Phone Device Type*</label><select id="wd-device" data-automation-id="phone-device-type"><option value="">Select One</option><option>Mobile</option><option>Home</option></select>
    <label for="wd-phone">Phone Number*</label><input id="wd-phone" data-automation-id="phone-number" type="text" />
    <label for="wd-city">City*</label><input id="wd-city" data-automation-id="addressSection_city" type="text" />
    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </div>
</body>
